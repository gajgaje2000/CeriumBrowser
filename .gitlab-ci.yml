spec:
  inputs:
    brave_version:
      type: string
      default: ""
      description: "Brave release version (e.g. <version>). Leave empty to auto-fetch latest stable from GitHub."
    compile_target:
      type: string
      default: "all"
      options:
        - "all"
        - "android"
        - "windows"
        - "windows_x64"
        - "windows_arm64"
      description: "Select target to compile (all, android, windows, windows_x64, windows_arm64)"
---
# GitLab CI Pipeline for Cerium Multi-Platform Distribution
# Unified architecture building Android (arm64), Windows (x64), and Windows (arm64)
# - Release branch builds all targets by default and publishes official release (or selected target via Web UI)
# - Web UI execution provides interactive selection of compile target via GitLab inputs

stages:
  - prepare
  - build
  - publish

variables:
  GIT_DEPTH: 1
  BRAVE_VERSION: "$[[ inputs.brave_version ]]"
  FORCE_CACHE_REBUILD: "${FORCE_CACHE_REBUILD:-false}"
  COMPILE_TARGET: "$[[ inputs.compile_target ]]"
  BUILD_TIMEOUT_SECONDS: "9600"
  RUNNER_AFTER_SCRIPT_TIMEOUT: "15m"
  SISO_PROJECT: "rbe-chromium-untrusted"
  RBE_project: "rbe-chromium-untrusted"
  RBE_instance: "projects/rbe-chromium-untrusted/instances/main"
  AUTONINJA_SKIP_EXTERNAL_ACCOUNT_CHECK: "1"
  GCLIENT_SUPPRESS_GIT_VERSION_WARNING: "1"
  BUILDER_IMAGE: "registry.gitlab.com/ceriumbrowser/cerium-browser/builder:latest"

# Pipeline execution rules:
# - release branch triggers on any push/merge to build and publish official release
# - manual Web UI execution triggers configurable target compilation
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - if: '$CI_COMMIT_BRANCH =~ /^feat\//'
      variables:
        COMPILE_TARGET: "windows_x64"
      when: always
    - when: never

# Modular includes with inputs propagation
include:
  - local: ".gitlab/ci/docker.yml"
  - local: ".gitlab/ci/common.yml"
    inputs:
      brave_version: "$[[ inputs.brave_version ]]"
      compile_target: "$[[ inputs.compile_target ]]"
  - local: ".gitlab/ci/android.yml"
    inputs:
      brave_version: "$[[ inputs.brave_version ]]"
      compile_target: "$[[ inputs.compile_target ]]"
  - local: ".gitlab/ci/windows.yml"
    inputs:
      brave_version: "$[[ inputs.brave_version ]]"
      compile_target: "$[[ inputs.compile_target ]]"
