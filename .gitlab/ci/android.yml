spec:
  inputs:
    brave_version:
      type: string
      default: ""
      description: "Brave release version. Leave empty to auto-fetch latest stable from GitHub."
    compile_target:
      type: string
      default: "all"
      description: "Target platform to compile (all, android, windows, windows_x64, windows_arm64)"
---
# Android Pipeline Jobs
# Included by .gitlab-ci.yml


build_android:
  stage: build
  extends:
    - .linux_2xlarge
    - .build_environment_setup
  retry:
    max: 1
    exit_codes:
      - 42
  needs:
    - job: prepare_source
      artifacts: true
  variables:
    ANDROID_KEYSTORE_FILE: "braving_android.jks"
    ANDROID_KEY_ALIAS: "braving"
    TARGET_ARCH: "arm64"
    TARGET_OS: "android"
  script:
    - export TARGET_ARCH="arm64"
    - echo "Verifying Android release signing credentials and fetching Secure File (${ANDROID_KEYSTORE_FILE})..."
    - ./scripts/platforms/android/package.sh --preflight
    - echo "Executing Android compile for release manifest metadata/releases/${DYNAMIC_BRAVE_VERSION}.yaml"
    - ./scripts/platforms/android/build.sh --manifest="metadata/releases/${DYNAMIC_BRAVE_VERSION}.yaml" --arch="${TARGET_ARCH}" --release
    - echo "Signing and verifying Android release APK..."
    - ./scripts/platforms/android/package.sh
  artifacts:
    name: "cerium-android-${TARGET_ARCH}-${DYNAMIC_BRAVE_VERSION}"
    when: always
    paths:
      - out/apks/
      - build-workspace/build-artifacts.tar.gz
      - metadata/releases/*.yaml
      - metadata/upstream-*.yaml
    expire_in: 30 days
  rules:
    - if: '$SKIP_BUILD == "true"'
      when: never
    - if: '$COMPILE_TARGET == "all" || $COMPILE_TARGET == "android"'
      when: on_success
    - when: never
