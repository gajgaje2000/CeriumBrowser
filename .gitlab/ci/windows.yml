spec:
  inputs:
    brave_version:
      type: string
      default: ""
      description: "Brave release version. Leave empty to auto-fetch latest stable from GitHub."
    compile_target:
      type: string
      default: "all"
      description: "Target platform to compile (all, android, windows, windows_x64, windows_arm64)"
---
# Windows Pipeline Jobs
# Included by .gitlab-ci.yml


.build_windows_base:
  stage: build
  extends:
    - .linux_2xlarge
    - .build_environment_setup
  retry:
    max: 1
    exit_codes:
      - 42
  variables:
    TARGET_OS: "win"
    WIN_TOOLCHAIN_URL: "https://gitlab.com/CeriumBrowser/Cerium-Browser/-/package_files/381442182/download"
  script:
    - echo "Executing Windows compile and package for release manifest metadata/releases/${DYNAMIC_BRAVE_VERSION}.yaml"
    - ./scripts/platforms/windows/build.sh --manifest="metadata/releases/${DYNAMIC_BRAVE_VERSION}.yaml" --arch="${TARGET_ARCH}" --release --package
  artifacts:
    name: "cerium-windows-${TARGET_ARCH}-${DYNAMIC_BRAVE_VERSION}"
    when: always
    paths:
      - out/packages/
      - build-workspace/build-artifacts.tar.gz
      - metadata/releases/*.yaml
      - metadata/upstream-*.yaml
    expire_in: 30 days

# ------------------------------------------------------------------------------
# Windows Build Jobs: x64 and arm64 targets
# ------------------------------------------------------------------------------
build_windows_x64:
  extends: .build_windows_base
  variables:
    TARGET_ARCH: "x64"
  needs:
    - job: prepare_source
      artifacts: true
  rules:
    - if: '$SKIP_BUILD == "true"'
      when: never
    - if: '$COMPILE_TARGET == "all" || $COMPILE_TARGET == "windows" || $COMPILE_TARGET == "windows_x64"'
      when: on_success
    - when: never

build_windows_arm64:
  extends: .build_windows_base
  variables:
    TARGET_ARCH: "arm64"
  needs:
    - job: prepare_source
      artifacts: true
  rules:
    - if: '$SKIP_BUILD == "true"'
      when: never
    - if: '$COMPILE_TARGET == "all" || $COMPILE_TARGET == "windows" || $COMPILE_TARGET == "windows_arm64"'
      when: on_success
    - when: never
